# /etc/nginx/sites-available/os.astu.tm
# TLS: certbot --nginx -d os.astu.tm
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name os.astu.tm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name os.astu.tm;

    ssl_certificate     /etc/letsencrypt/live/os.astu.tm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.astu.tm/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
